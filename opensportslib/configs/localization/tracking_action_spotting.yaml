SYSTEM:
  paths:
    save_dir: ./checkpoints_as_tracking
  gpu:
    count: 1

DATA:
  common:
    dataset_name: SoccerNet-GAR-Spotting-Tracking
    data_root: /home/karkid/PFF/sngar-spotting-tracking-dedup
    classes:
      - PASS
      - HEADER
      - HIGH PASS
      - OUT
      - CROSS
      - THROW IN
      - SHOT
      - PLAYER SUCCESSFUL TACKLE
      - FREE KICK
      - GOAL
    splits:
      train:
        type: TrackingActionSpot
        annotation_path: ${DATA.common.data_root}/annotations_train.json
        source_path: ${DATA.common.data_root}
        dataloader:
          batch_size: 4
          shuffle: true
          num_workers: 16        # graph build is CPU bound
          pin_memory: true
      valid:
        type: TrackingActionSpot
        annotation_path: ${DATA.common.data_root}/annotations_valid.json
        source_path: ${DATA.common.data_root}
        dataloader:
          batch_size: 4
          shuffle: false
          num_workers: 16
          pin_memory: true
      valid_data_frames:
        type: TrackingActionSpotVideo
        annotation_path: ${DATA.common.splits.valid.annotation_path}
        source_path: ${DATA.common.splits.valid.source_path}
        overlap_len: 0
        dataloader:
          batch_size: 1
          shuffle: false
          num_workers: 2
          pin_memory: false
      test:
        type: TrackingActionSpotVideo
        annotation_path: ${DATA.common.data_root}/annotations_test.json
        source_path: ${DATA.common.data_root}
        results: results_spotting_test
        metric: tight
        nms_window: 2
        overlap_len: 270         # 90% of clip_len
        dataloader:
          batch_size: 1
          shuffle: false
          num_workers: 2
          pin_memory: false

  inputs:
    video:
      modality: tracking_parquet
      representation: raw
      source:
        format: parquet
      sampling:
        epoch_num_frames: 1500000  # 5000 clips/epoch
        clip_len: 300
        extract_fps: 5
      transform:
        normalize: true           # x, y, dx, dy, z by the pitch constants below
      augmentations:              # train only; the dataset gates on is_eval
        vertical_flip: true
        horizontal_flip: true
        team_flip: true
      params:
        dilate_len: 1
        mixup: false              # undefined on graphs; overrides the RGB default
        objects:
          num_objects: 23
          feature_dim: 8
          pitch_half_length: 85.0
          pitch_half_width: 50.0
          max_displacement: 110.0
          max_ball_height: 30.0

MODEL:
  metadata:
    family: E2E
    runner:
      type: runner_e2e
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        registry: backbone
        name: graph_conv_seq      # per-frame embeddings, not a pooled clip vector
      params:
        #   gen        GENConv    softmax aggregation, learnable t and p
        #   gat        GATv2Conv  four attention heads
        #   sageconv   SAGEConv   mean, max and std aggregation
        #   gin        GINConv    sum aggregation over a two-layer MLP
        #   edgeconv   EdgeConv   max aggregation over node pairs
        #   graphconv  GraphConv  plain add
        encoder: graphconv
        hidden_dim: 64
        num_layers: 20
        dropout: 0.1
        edge_type: positional
        k: 8
        radius: 15.0
    task_head:
      kind: head
      source:
        provider: opensportslib
        registry: head
        name: gru

TRAIN:
  trainer:
    type: trainer_e2e
  epochs: 100
  criterion:
    type: CrossEntropyLoss
  optimizer:
    type: AdamWithScaler
    lr: 0.001
  scheduler:
    type: ChainedSchedulerE2E
    acc_grad_iter: 1
    num_epochs: ${TRAIN.epochs}
    warm_up_epochs: 5
  execution:
    enabled: true
    multi_gpu: false
    acc_grad_iter: 1
    base_num_valid_epochs: 30
    start_valid_epoch: 4
    valid_map_every: 10           
    criterion_valid: map
  selection:
    monitor: valid_loss
    mode: min
  checkpoint:
    save_best: true
