DATA:
  common:
    dataset_name: SoccerNet
    data_root: /home/vorajv/dataset/SNAS-ResNET_PCA512
    classes:
      - Penalty
      - Kick-off
      - Goal
      - Substitution
      - Offside
      - Shots on target
      - Shots off target
      - Clearance
      - Ball out of play
      - Throw-in
      - Foul
      - Indirect free-kick
      - Direct free-kick
      - Corner
      - Yellow card
      - Red card
      - Yellow->red card
    splits:
      train:
        type: FeatureClipsfromJSON
        annotation_path: ${DATA.common.data_root}/annotations-2024-224p-train.json
        source_path: ${DATA.common.data_root}
        output_map: [data, label]
        dataloader:
          batch_size: 256
          shuffle: true
          num_workers: 4
          pin_memory: true
      valid:
        type: FeatureClipsfromJSON
        annotation_path: ${DATA.common.data_root}/annotations-2024-224p-valid.json
        source_path: ${DATA.common.data_root}
        output_map: [data, label]
        dataloader:
          batch_size: 256
          shuffle: true
          num_workers: 4
          pin_memory: true
      test:
        type: FeatureVideosfromJSON
        annotation_path: ${DATA.common.data_root}/annotations-2024-224p-test.json
        source_path: ${DATA.common.data_root}
        output_map: [data, label]
        results: results_spotting_test_netvlad++_resnetpca512
        metric: loose
        dataloader:
          batch_size: 1
          shuffle: false
          num_workers: 1
          pin_memory: true
  inputs:
    video:
      modality: video
      representation: features
      source:
        format: npy
      sampling:
        framerate: 2
        window_size: 20
      transform: {}
      augmentations: {}
      params: {}

MODEL:
  metadata:
    family: LearnablePooling
    runner:
      type: runner_JSON
  components:
    video_encoder:
      source:
        provider: opensportslib
        registry: backbone
        name: PreExtactedFeatures
      params:
        encoder: ResNET_TF2_PCA512
        feature_dim: 512
        output_dim: 512
        framerate: 2
        window_size: 20
    video_adapter:
      source:
        provider: opensportslib
        registry: neck
        name: NetVLAD++
      params:
        input_dim: 512
        output_dim: 32768
        vocab_size: 64
    task_head:
      source:
        provider: opensportslib
        registry: head
        name: LinearLayer
      params:
        input_dim: 32768
        num_classes: 17
    event_postprocessor:
      kind: postprocessor
      source:
        provider: opensportslib
        registry: post_proc
        name: NMS
      params:
        NMS_window: 30
        NMS_threshold: 0.0

IO:
  outputs:
    predictions: task_head
    events: event_postprocessor

TRAIN:
  trainer:
    type: trainer_pooling
  epochs: 200
  criterion:
    type: NLLLoss
  optimizer:
    type: Adam
    lr: 0.001
    betas: [0.9, 0.999]
    eps: 1e-08
    weight_decay: 0
    amsgrad: false
  scheduler:
    type: ReduceLROnPlateau
    mode: min
    factor: 1e-03
    min_lr: 1e-06
    patience: 10
    verbose: true
  execution:
    evaluation_frequency: 200
