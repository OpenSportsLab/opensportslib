TASK: localization
VERSION: 2

SYSTEM:
  paths:
    work_dir: ${SYSTEM.paths.save_dir}
  gpu:
    count: 4

DATA:
  common:
    dataset_name: SoccerNet
    data_root: /path/to/data
    classes: []
    splits:
      train:
        annotation_path: /path/to/train.json
        source_path: /path/to/train
        output_map: [data, label]
        dataloader:
          batch_size: 8
          shuffle: true
          num_workers: 4
          pin_memory: true
      valid:
        annotation_path: /path/to/valid.json
        source_path: /path/to/valid
        output_map: [data, label]
        dataloader:
          batch_size: 8
          shuffle: false
          num_workers: 4
          pin_memory: true
      test:
        annotation_path: /path/to/test.json
        source_path: /path/to/test
        output_map: [data, label]
        dataloader:
          batch_size: 1
          shuffle: false
          num_workers: 1
          pin_memory: true
  inputs:
    video:
      modality: video
      representation: raw
      source:
        format: mp4
      sampling:
        clip_len: 100
        input_fps: 25
        extract_fps: 2
      transform:
        resize:
          height: 224
          width: 398
        normalization:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
      augmentations: {}
      params:
        color_mode: rgb
        crop_dim: -1
        mixup: true
        dilate_len: 0

MODEL:
  metadata:
    family: E2E
    runner:
      type: runner_e2e
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        registry: backbone
        name: null
      params: {}
      overrides: {}
    task_head:
      kind: head
      source:
        provider: opensportslib
        registry: head
        name: null
      params: {}
      overrides: {}
  topology:
    - from: video_encoder
      to: task_head

IO:
  inputs:
    video: video_encoder
    label: task_head
  outputs:
    logits: task_head

TRAIN:
  trainer:
    type: trainer_e2e
  epochs: 10
  criterion:
    type: CrossEntropyLoss
  optimizer:
    type: AdamWithScaler
    lr: 0.01
  scheduler:
    type: ChainedSchedulerE2E
    acc_grad_iter: 1
    num_epochs: ${TRAIN.epochs}
    warm_up_epochs: 3
  execution:
    enabled: true
    multi_gpu: true
    acc_grad_iter: 1
    base_num_valid_epochs: 30
    start_valid_epoch: 4
    valid_map_every: 1
    criterion_valid: map
  sampling: {}
  selection:
    monitor: valid_loss
    mode: min
  checkpoint:
    save_best: true
