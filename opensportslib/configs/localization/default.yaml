TASK: localization
VERSION: 2

SYSTEM:
  paths:
    log_dir: ./logs
    save_dir: ./checkpoints
    work_dir: ${SYSTEM.paths.save_dir}
  device: cuda
  gpu:
    count: 4
    id: 0
  reproducibility:
    use_seed: true
    seed: 42

DATA:
  common:
    dataset_name: SoccerNet
    data_root: /path/to/data
    classes: []
    runtime:
      loader_backend: opencv
    splits:
      train:
        annotation_path: /path/to/train.json
        source_path: /path/to/train
        output_map: [data, label]
        dataloader:
          batch_size: 8
          shuffle: true
          num_workers: 4
          pin_memory: true
      valid:
        annotation_path: /path/to/valid.json
        source_path: /path/to/valid
        output_map: [data, label]
        dataloader:
          batch_size: 8
          shuffle: false
          num_workers: 4
          pin_memory: true
      test:
        annotation_path: /path/to/test.json
        source_path: /path/to/test
        output_map: [data, label]
        dataloader:
          batch_size: 1
          shuffle: false
          num_workers: 1
          pin_memory: true
  inputs:
    video:
      modality: video
      representation: raw
      source:
        format: mp4
      sampling:
        clip_len: 100
        input_fps: 25
        extract_fps: 2
      transform:
        resize:
          height: 224
          width: 398
        normalization:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
      augmentations: {}
      params:
        color_mode: rgb
        crop_dim: -1
        mixup: true
        dilate_len: 0

MODEL:
  runtime:
    dtype: fp32
    device: auto
    compile: false
    freeze: false
  load:
    checkpoint_path: null
    pretrained: false
    strict: true
    map_location: null
    format: auto
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        registry: backbone
        name: null
      params: {}
      overrides: {}
    task_head:
      kind: head
      source:
        provider: opensportslib
        registry: head
        name: null
      params: {}
      overrides: {}
  topology:
    - from: video_encoder
      to: task_head

IO:
  inputs:
    video: video_encoder
    label: task_head
  outputs:
    logits: task_head

TRAIN:
  trainer:
    type: localization
  epochs: 10
  criterion:
    type: CrossEntropyLoss
  optimizer:
    type: AdamWithScaler
    lr: 0.01
  scheduler:
    type: ChainedSchedulerE2E
  execution:
    enabled: true
  sampling: {}
  selection:
    monitor: valid_loss
    mode: min
  checkpoint:
    save_best: true
