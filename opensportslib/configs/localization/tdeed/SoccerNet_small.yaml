TASK: localization
VERSION: 2
SYSTEM:
  device: cuda
  gpu:
    count: 1
  paths:
    save_dir: outputs/tdeed
  reproducibility:
    seed: 1
    use_seed: true
DATA:
  common:
    dataset_name: soccernet
    data_root: data/spotting-cleanup/SoccerNet
    classes:
    - Penalty
    - Kick-off
    - Goal
    - Substitution
    - Offside
    - Shots on target
    - Shots off target
    - Clearance
    - Ball out of play
    - Throw-in
    - Foul
    - Indirect free-kick
    - Direct free-kick
    - Corner
    - Yellow card
    - Red card
    - Yellow->red card
    splits:
      train:
        type: TDEEDVideo
        annotation_path: ${DATA.common.data_root}/train.json
        source_path: ${DATA.common.data_root}
        overlap_len: 50
        dataloader:
          batch_size: 8
          num_workers: 4
      valid:
        type: TDEEDVideo
        annotation_path: ${DATA.common.data_root}/valid.json
        source_path: ${DATA.common.data_root}
        overlap_len: 0
        dataloader:
          batch_size: 8
          num_workers: 4
      test:
        type: TDEEDVideo
        annotation_path: ${DATA.common.data_root}/test.json
        source_path: ${DATA.common.data_root}
        overlap_len: 50
        dataloader:
          batch_size: 8
          num_workers: 4
  inputs:
    video:
      modality: video
      representation: raw
      source:
        format: video
        repo_id: SoccerNet/SoccerNet_raw_HQ
        revision: 56a8be6be6788ed65cce25f68780d55ff4544aa2
      sampling:
        clip_len: 100
        stride: 12
        epoch_num_frames: 500000
      transform:
        resize:
          height: 224
          width: 398
      params:
        mixup: true
        dilate_len: 0
MODEL:
  metadata:
    family: TDEED
    runner:
      type: runner_tdeed
    reference_commit: d953b4de8a2ad941c565e1683c5b07255cbe644e
    reference_config: SoccerNet_small.json
    reference_config_sha256: 6a46809d908e227831806cb5b9285432d1315920a80ca3adbfaa5c3614a10556
    recipe: released-code
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        registry: backbone
        name: rny002_gsf
      params:
        feature_arch: rny002_gsf
        modality: rgb
        pretrained: true
        crop_dim: null
        pretrained_model_id: timm/regnety_002.pycls_in1k
        pretrained_revision: 3c4d5882de76610654d238ecd8f265519505aa51
    task_head:
      kind: head
      source:
        provider: opensportslib
        registry: head
        name: ed_sgp_mixer
      params:
        temporal_arch: ed_sgp_mixer
        radi_displacement: 3
        n_layers: 3
        sgp_ks: 9
        sgp_r: 4
  topology:
  - from: video_encoder
    to: task_head
IO:
  inputs:
    video: video_encoder
  outputs:
    logits: task_head
TRAIN:
  trainer:
    type: trainer_tdeed
  epochs: 100
  optimizer:
    type: AdamW
    lr: 0.0008
    weight_decay: 0.01
  scheduler:
    type: reference_chained
    warm_up_epochs: 6
  execution:
    enabled: true
    acc_grad_iter: 1
    start_valid_epoch: 60
  selection:
    monitor: valid_map
    mode: max
    test_flip: false
    postprocessing: soft_nms
    nms_window: 3
    soft_nms_window: 6
    validation_protocol: released_snas_clips
