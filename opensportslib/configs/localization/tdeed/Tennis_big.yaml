TASK: localization
VERSION: 2
SYSTEM:
  device: cuda
  gpu:
    count: 1
  paths:
    save_dir: outputs/tdeed
  reproducibility:
    seed: 1
    use_seed: true
DATA:
  common:
    dataset_name: tennis
    data_root: data/spotting-cleanup/Tennis/prepared
    classes:
    - far_court_bounce
    - far_court_swing
    - far_court_serve
    - near_court_bounce
    - near_court_swing
    - near_court_serve
    splits:
      train:
        type: TDEEDVideo
        annotation_path: ${DATA.common.data_root}/train.json
        source_path: ${DATA.common.data_root}
        overlap_len: 75
        dataloader:
          batch_size: 8
          num_workers: 4
      valid:
        type: TDEEDVideo
        annotation_path: ${DATA.common.data_root}/validation.json
        source_path: ${DATA.common.data_root}
        overlap_len: 0
        dataloader:
          batch_size: 8
          num_workers: 4
      test:
        type: TDEEDVideo
        annotation_path: ${DATA.common.data_root}/test.json
        source_path: ${DATA.common.data_root}
        overlap_len: 75
        dataloader:
          batch_size: 8
          num_workers: 4
  inputs:
    video:
      modality: video
      representation: raw
      source:
        format: video
        repo_id: OpenSportsLab/OSL-loc-tennis-public
        revision: a9293a04e25e0e68f64d9ec308120e9fa27d5c77
      sampling:
        clip_len: 100
        stride: 1
        epoch_num_frames: 500000
      transform:
        resize:
          height: 224
          width: 398
      params:
        mixup: true
        dilate_len: 0
MODEL:
  metadata:
    family: TDEED
    runner:
      type: runner_tdeed
    reference_commit: d953b4de8a2ad941c565e1683c5b07255cbe644e
    reference_config: Tennis_big.json
    reference_config_sha256: 00a9be0ed82336ed95f894843c501a2cf1ce3f4c3298f6e68b23011fdc48a1b6
    recipe: released-code
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        registry: backbone
        name: rny008_gsf
      params:
        feature_arch: rny008_gsf
        modality: rgb
        pretrained: true
        crop_dim: 224
        pretrained_model_id: timm/regnety_008.pycls_in1k
        pretrained_revision: ad27a8e42099466890afc4dbcc24cce1340776b9
    task_head:
      kind: head
      source:
        provider: opensportslib
        registry: head
        name: ed_sgp_mixer
      params:
        temporal_arch: ed_sgp_mixer
        radi_displacement: 1
        n_layers: 3
        sgp_ks: 11
        sgp_r: 4
  topology:
  - from: video_encoder
    to: task_head
IO:
  inputs:
    video: video_encoder
  outputs:
    logits: task_head
TRAIN:
  trainer:
    type: trainer_tdeed
  epochs: 50
  optimizer:
    type: AdamW
    lr: 0.0008
    weight_decay: 0.01
  scheduler:
    type: reference_chained
    warm_up_epochs: 3
  execution:
    enabled: true
    acc_grad_iter: 1
    start_valid_epoch: 20
  selection:
    monitor: valid_map
    mode: max
    test_flip: true
    postprocessing: soft_nms
    nms_window: 1
    soft_nms_window: 3
