SYSTEM:
  paths:
    save_dir: outputs/e2espot/campaign
    work_dir: outputs/e2espot/campaign
    log_dir: outputs/e2espot/logs
  device: cuda
  gpu:
    count: 1
    id: 0
  reproducibility:
    use_seed: true
    seed: 42
DATA:
  common:
    runtime:
      loader_backend: opencv
    dataset_name: finegym
    data_root: data/spotting-cleanup/FineGym/prepared
    classes:
    - BB_dismounts_end
    - BB_dismounts_start
    - BB_flight_handspring_end
    - BB_flight_handspring_start
    - BB_flight_salto_end
    - BB_flight_salto_start
    - BB_leap_jump_hop_end
    - BB_leap_jump_hop_start
    - BB_turns_end
    - BB_turns_start
    - FX_back_salto_end
    - FX_back_salto_start
    - FX_front_salto_end
    - FX_front_salto_start
    - FX_leap_jump_hop_end
    - FX_leap_jump_hop_start
    - FX_side_salto_end
    - FX_side_salto_start
    - FX_turns_end
    - FX_turns_start
    - UB_circles_end
    - UB_circles_start
    - UB_dismounts_end
    - UB_dismounts_start
    - UB_fligh_same_bar_end
    - UB_fligh_same_bar_start
    - UB_transition_flight_end
    - UB_transition_flight_start
    - VT_0
    - VT_1
    - VT_2
    - VT_3
    splits:
      train:
        type: VideoGameWithOpencv
        annotation_path: data/spotting-cleanup/FineGym/prepared/train.json
        source_path: data/spotting-cleanup/FineGym/prepared
        output_map:
        - data
        - label
        overlap_len: 0
        metric: tight
        nms_window: 1
        results: predictions
        dataloader:
          batch_size: 8
          shuffle: false
          num_workers: 4
          pin_memory: true
      valid:
        type: VideoGameWithOpencv
        annotation_path: data/spotting-cleanup/FineGym/prepared/valid.json
        source_path: data/spotting-cleanup/FineGym/prepared
        output_map:
        - data
        - label
        overlap_len: 0
        metric: tight
        nms_window: 1
        results: predictions
        dataloader:
          batch_size: 8
          shuffle: false
          num_workers: 4
          pin_memory: true
      valid_data_frames:
        type: VideoGameWithOpencvVideo
        annotation_path: data/spotting-cleanup/FineGym/prepared/valid.json
        source_path: data/spotting-cleanup/FineGym/prepared
        output_map:
        - data
        - label
        overlap_len: 0
        metric: tight
        nms_window: 1
        results: predictions
        dataloader:
          batch_size: 8
          shuffle: false
          num_workers: 4
          pin_memory: true
      test:
        type: VideoGameWithOpencvVideo
        annotation_path: data/spotting-cleanup/FineGym/prepared/test.json
        source_path: data/spotting-cleanup/FineGym/prepared
        output_map:
        - data
        - label
        overlap_len: 50
        metric: tight
        nms_window: 1
        results: predictions
        dataloader:
          batch_size: 8
          shuffle: false
          num_workers: 4
          pin_memory: true
  inputs:
    video:
      modality: video
      representation: raw
      source:
        format: video
      sampling:
        clip_len: 100
        epoch_num_frames: 500000
        input_fps: 25
        extract_fps: 25
      transform:
        resize:
          height: 224
          width: 398
        normalization:
          mean:
          - 0.485
          - 0.456
          - 0.406
          std:
          - 0.229
          - 0.224
          - 0.225
      augmentations: {}
      params:
        crop_dim: 224
        mixup: true
        dilate_len: 0
MODEL:
  runtime:
    dtype: fp32
    device: auto
    compile: false
    freeze: false
  load:
    checkpoint_path: null
    pretrained: false
    strict: true
    map_location: null
    format: auto
  metadata:
    family: E2E
    runner:
      type: runner_e2e
    paper: ECCV 2022 E2E-Spot
    experiment: finegym_small_rgb
    recipe_scope: released-author-config
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        registry: backbone
        name: rny002_gsm
      params:
        type: rny002_gsm
      overrides: {}
    task_head:
      kind: head
      source:
        provider: opensportslib
        registry: head
        name: gru
      params:
        type: gru
      overrides: {}
  topology:
  - from: video_encoder
    to: task_head
  policies: {}
IO:
  inputs:
    video: video_encoder
    label: task_head
  outputs:
    logits: task_head
TASK: localization
VERSION: 2
TRAIN:
  trainer:
    type: trainer_e2e
  epochs: 100
  criterion:
    type: CrossEntropyLoss
  optimizer:
    type: AdamWithScaler
    lr: 0.001
  scheduler:
    type: ChainedSchedulerE2E
    acc_grad_iter: 1
    num_epochs: 100
    warm_up_epochs: 3
  execution:
    enabled: true
    multi_gpu: false
    acc_grad_iter: 1
    base_num_valid_epochs: 20
    start_valid_epoch: 80
    valid_map_every: 1
    criterion_valid: map
  sampling:
    use_weighted_sampler: false
    use_weighted_loss: false
  selection:
    monitor: valid_map
    mode: max
  checkpoint:
    save_best: true
