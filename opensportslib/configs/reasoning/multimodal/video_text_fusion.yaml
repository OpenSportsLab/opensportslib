TASK: reasoning
VERSION: 2

SYSTEM:
  paths:
    log_dir: ./logs
    save_dir: ./checkpoints_reasoning
  device: cuda
  gpu:
    count: 1
    id: 0
  reproducibility:
    use_seed: true
    seed: 42

DATA:
  common:
    dataset_name: multimodal_reasoning
    data_root: /path/to/data
    runtime:
      loader_backend: opencv
    splits:
      train:
        annotation_path: /path/to/train.json
        source_path: /path/to/train
        dataloader:
          batch_size: 8
          shuffle: true
          num_workers: 4
          pin_memory: true
      valid:
        annotation_path: /path/to/valid.json
        source_path: /path/to/valid
        dataloader:
          batch_size: 8
          shuffle: false
          num_workers: 4
          pin_memory: true
      test:
        annotation_path: /path/to/test.json
        source_path: /path/to/test
        dataloader:
          batch_size: 8
          shuffle: false
          num_workers: 4
          pin_memory: true
  inputs:
    video:
      modality: video
      representation: raw
      source:
        format: mp4
      sampling:
        num_frames: 16
      transform:
        resize:
          height: 224
          width: 224
      augmentations: {}
      params:
        color_mode: rgb
    text:
      modality: text
      representation: raw
      source:
        format: json
      sampling: {}
      transform: {}
      augmentations: {}
      params: {}

MODEL:
  runtime:
    dtype: bf16
    device: auto
    compile: false
    freeze: false
  load:
    checkpoint_path: null
    pretrained: false
    strict: true
    map_location: null
    format: auto
  components:
    video_encoder:
      kind: encoder
      source:
        provider: huggingface
        repo_id: MCG-NJU/videomae-base
      load:
        pretrained: true
      params: {}
      overrides: {}
    text_encoder:
      kind: encoder
      source:
        provider: huggingface
        repo_id: sentence-transformers/all-mpnet-base-v2
      load:
        pretrained: true
      params: {}
      overrides: {}
    multimodal_fusion:
      kind: fusion
      source:
        provider: opensportslib
        registry: fusion
        name: CrossModalTransformer
      params:
        hidden_dim: 768
        num_layers: 4
      overrides: {}
    task_head:
      kind: head
      source:
        provider: opensportslib
        registry: head
        name: ReasoningHead
      params: {}
      overrides: {}
  topology:
    - from: video_encoder
      to: multimodal_fusion
      map:
        features: video_tokens
    - from: text_encoder
      to: multimodal_fusion
      map:
        features: text_tokens
    - from: multimodal_fusion
      to: task_head

IO:
  inputs:
    video: video_encoder
    text: text_encoder
    label: task_head
  outputs:
    logits: task_head

TRAIN:
  trainer:
    type: reasoning
  epochs: 20
  criterion:
    type: CrossEntropyLoss
  optimizer:
    type: AdamW
    lr: 0.0001
  scheduler:
    type: StepLR
  execution:
    enabled: true
    use_amp: true
  sampling: {}
  selection:
    monitor: loss
    mode: min
  checkpoint:
    save_every: 5
    save_best: true
