SYSTEM:
  paths:
    save_dir: ./checkpoints_video

DATA:
  common:
    dataset_name: sngar
    data_root: /home/vorajv/dataset/sngar-frames
    splits:
      train:
        annotation_path: ${DATA.common.data_root}/train.json
        source_path: ${DATA.common.data_root}
        dataloader:
          batch_size: 8
          shuffle: true
          num_workers: 8
          pin_memory: true
      valid:
        annotation_path: ${DATA.common.data_root}/valid.json
        source_path: ${DATA.common.data_root}
        dataloader:
          batch_size: 8
          shuffle: false
          num_workers: 8
          pin_memory: true
      test:
        annotation_path: ${DATA.common.data_root}/test.json
        source_path: ${DATA.common.data_root}
        dataloader:
          batch_size: 8
          shuffle: false
          num_workers: 8
          pin_memory: true
  inputs:
    video:
      modality: frames_npy
      representation: frames_npy
      source:
        format: npy
      sampling:
        num_frames: 16
      transform:
        resize:
          height: 224
          width: 224
      augmentations:
        random_horizontal_flip: true
        flip_prob: 0.5
        color_jitter: true
        jitter_prob: 0.5
        jitter_params: [0.2, 0.2, 0.2, 0.1]
      params:
        color_mode: rgb
        data_slicing:
          enabled: false
          training_matches: 45

MODEL:
  components:
    video_encoder:
      source:
        provider: opensportslib
        registry: backbone
        name: videomae2
      load:
        pretrained: true
      runtime:
        freeze: false
      params:
        pretrained_model: OpenGVLab/VideoMAEv2-Base
        hidden_dim: 768
      overrides:
        unfreeze_last_n_layers: 0
    video_adapter:
      source:
        provider: opensportslib
        registry: neck
        name: TemporalAggregation
      params:
        agr_type: maxpool
        hidden_dim: 768
        dropout: 0.1
        lstm_dropout: 0.3
        num_attention_heads: 8
    task_head:
      source:
        provider: opensportslib
        registry: head
        name: TrackingClassifier
      params:
        hidden_dim: 64
        num_classes: 10
        dropout: 0.1

TRAIN:
  epochs: 100
  optimizer:
    type: AdamW
    lr: 0.00005
    betas: [0.9, 0.999]
    eps: 0.0000001
    weight_decay: 0.0001
    amsgrad: false
  scheduler:
    type: ReduceLROnPlateau
    mode: min
    patience: 5
    factor: 0.1
    min_lr: 1e-8
  execution:
    use_amp: true
    mixup_alpha: 0.2
    detailed_results: true
  sampling:
    use_weighted_sampler: true
    samples_per_class: 4000
  selection:
    monitor: loss
    patience: 5
  checkpoint:
    save_every: 5
