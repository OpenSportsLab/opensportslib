SYSTEM:
  paths:
    save_dir: ./checkpoints_tracking

DATA:
  common:
    dataset_name: sngar
    data_root: /home/vorajv/dataset/sngar-tracking
    splits:
      train:
        type: annotations_train.json
        annotation_path: ${DATA.common.splits.train.source_path}/train.json
        source_path: ${DATA.common.data_root}
        dataloader:
          batch_size: 32
          shuffle: true
          num_workers: 8
          pin_memory: true
      valid:
        type: annotations_valid.json
        annotation_path: ${DATA.common.splits.valid.source_path}/valid.json
        source_path: ${DATA.common.data_root}
        dataloader:
          batch_size: 32
          shuffle: false
          num_workers: 8
          pin_memory: true
      test:
        type: annotations_test.json
        annotation_path: ${DATA.common.splits.test.source_path}/test.json
        source_path: ${DATA.common.data_root}
        dataloader:
          batch_size: 32
          shuffle: false
          num_workers: 8
          pin_memory: true
  inputs:
    video:
      modality: tracking_parquet
      representation: raw
      source:
        format: parquet
      sampling:
        num_frames: 16
        frame_interval: 9
      transform:
        normalize: true
      augmentations:
        vertical_flip: true
        horizontal_flip: true
        team_flip: true
      params:
        preload_data: false
        objects:
          num_objects: 23
          feature_dim: 8
          pitch_half_length: 85.0
          pitch_half_width: 50.0
          max_displacement: 110.0
          max_ball_height: 30.0
        data_slicing:
          enabled: false
          training_matches: 45

MODEL:
  components:
    video_encoder:
      source:
        provider: opensportslib
        registry: backbone
        name: graph_conv
      params:
        encoder: gin
        hidden_dim: 64
        num_layers: 20
        dropout: 0.1
        edge_type: positional
        k: 8
        radius: 15.0
    video_adapter:
      source:
        provider: opensportslib
        registry: neck
        name: TemporalAggregation
      params:
        agr_type: maxpool
        hidden_dim: 64
        dropout: 0.1
        use_position_encoding: true
    task_head:
      source:
        provider: opensportslib
        registry: head
        name: TrackingClassifier
      params:
        hidden_dim: 64
        dropout: 0.1
        num_classes: 10

TRAIN:
  epochs: 100
  optimizer:
    type: Adam
    lr: 0.001
  scheduler:
    type: ReduceLROnPlateau
    mode: min
    patience: 10
    factor: 0.1
    min_lr: 1e-8
  execution:
    detailed_results: true
  sampling:
    use_weighted_sampler: true
    samples_per_class: 4000
  selection:
    monitor: loss
    patience: 10
  checkpoint:
    save_every: 20
