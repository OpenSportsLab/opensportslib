TASK: VQA
VERSION: 2

SYSTEM:
  paths:
    log_dir: ./logs
    save_dir: ./checkpoints_vqa_lora
    work_dir: ./checkpoints_vqa_lora
  device: cuda
  gpu:
    count: 4
    id: 0
  reproducibility:
    use_seed: true
    seed: 42

DATA:
  common:
    dataset_name: OSL-XFoul
    data_root: /home/vorajv/dataset/OSL-XFoul
    runtime:
      loader_backend: opencv
    splits:
      train:
        annotation_path: /home/vorajv/dataset/OSL-XFoul/train.json
        source_path: /home/vorajv/dataset/OSL-XFoul
        dataloader:
          batch_size: 1
          shuffle: true
          num_workers: 0
          pin_memory: false
      valid:
        annotation_path: /home/vorajv/dataset/OSL-XFoul/valid.json
        source_path: /home/vorajv/dataset/OSL-XFoul
        dataloader:
          batch_size: 1
          shuffle: false
          num_workers: 0
          pin_memory: false
      test:
        annotation_path: /home/vorajv/dataset/OSL-XFoul/test.json
        source_path: /home/vorajv/dataset/OSL-XFoul
        dataloader:
          batch_size: 1
          shuffle: false
          num_workers: 0
          pin_memory: false
  inputs:
    video:
      modality: video
      representation: raw
      source:
        format: mp4
      sampling:
        start_frame: 63
        end_frame: 87
        input_fps: 25
        target_fps: 17
        temporal_tokens: 44
      transform: {}
      augmentations: {}
      params: {}
    question:
      modality: text
      representation: raw
      source:
        format: json
      sampling: {}
      transform: {}
      augmentations: {}
      params: {}

MODEL:
  runtime:
    dtype: fp32
    device: auto
    compile: false
    freeze: false
  load:
    checkpoint_path: null
    pretrained: false
    strict: true
    map_location: null
    format: auto
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        registry: backbone
        name: lightweight_video_descriptor
      params: {}
      overrides: {}
    mm_projector:
      kind: projector
      source:
        provider: opensportslib
        registry: adapter
        name: numeric_linear_projector
      params:
        input_dim: 270
        output_dim: 64
      overrides: {}
    llm_decoder:
      kind: decoder
      source:
        provider: huggingface
        name: lmsys/vicuna-7b-v1.1
      params:
        repo_id: lmsys/vicuna-7b-v1.1
      overrides: {}
  topology:
    - from: video_encoder
      to: mm_projector
    - from: mm_projector
      to: llm_decoder
  metadata:
    backend: xvars_hf

IO:
  inputs:
    video: video_encoder
    question: llm_decoder
  outputs:
    answer_text: llm_decoder
    explanation_text: llm_decoder

TRAIN:
  trainer:
    type: vqa
  epochs: 1
  criterion:
    type: CrossEntropyLoss
  optimizer:
    type: AdamW
    lr: 0.0002
  scheduler:
    type: constant
  execution:
    enabled: true
    backend: xvars_hf
    training_backend: xvars_lora
    dry_run: false
    prompt:
      style: detailed
      system_prompt: You are an artificial intelligence assistant for visual football referee questions. Give short and helpful answers.
      include_priors: true
      prior_fields: [action, offence, contact, bodypart]
    generation:
      max_new_tokens: 32
      temperature: 0.2
    benchmark:
      subset_ids: [action_1, action_2]
      max_samples: 8
      lora_checkpoint: /home/vorajv/opensportslib/checkpoints_vqa_lora/lightweight_video_descriptor/f8ed1514/xvars_lora
    eval_profile:
      metric_set: [exact_match, contains_match, token_f1, semantic]
      aggregation: mean
      exclusions: []
    production:
      timeout_s: 30
      retry_count: 1
      retry_backoff_s: 0.5
      fallback_policy: baseline_on_failure
      max_new_tokens_cap: 64
    sft:
      max_seq_length: 768
      answer_field: references
      include_video_tokens: true
      video_token_len: 300
      per_device_train_batch_size: 1
      per_device_eval_batch_size: 1
      gradient_accumulation_steps: 1
      num_train_epochs: 1
      learning_rate: 0.0001
      logging_steps: 50
      disable_tqdm: true
      completion_only_loss: true
      save_strategy: "no"
      fp16: false
      bf16: false
    hf:
      model_id: lmsys/vicuna-7b-v1.1
      local_files_only: false
      prefer_cuda: true
      cuda_device_index: 1
    lora:
      r: 16
      alpha: 32
      dropout: 0.05
      bias: none
      prepare_kbit: true
      target_modules: [mm_projector, upsample_features, up_proj, down_proj, gate_proj, k_proj, q_proj, v_proj, o_proj]
    quantization:
      enabled: true
      load_in_4bit: true
      bnb_4bit_quant_type: nf4
      compute_dtype: bfloat16
      bnb_4bit_use_double_quant: true
    checkpoint:
      save_adapter: true
      merge_and_save: false
  sampling: {}
  selection:
    monitor: loss
    mode: min
  checkpoint:
    save_every: 1
    save_best: true
