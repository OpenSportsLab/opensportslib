TASK: VQA
VERSION: 2

SYSTEM:
  paths:
    log_dir: ./logs
    save_dir: ./checkpoints_vqa_lora
    work_dir: ./checkpoints_vqa_lora
  device: cuda
  gpu:
    count: 4
    id: 0
  reproducibility:
    use_seed: true
    seed: 42

DATA:
  common:
    dataset_name: OSL-XFoul
    data_root: /home/vorajv/dataset/OSL-XFoul
    runtime:
      loader_backend: opencv
    splits:
      train:
        annotation_path: /home/vorajv/dataset/OSL-XFoul/train.json
        source_path: /home/vorajv/dataset/OSL-XFoul
        dataloader:
          batch_size: 1
          shuffle: true
          num_workers: 0
          pin_memory: false
      valid:
        annotation_path: /home/vorajv/dataset/OSL-XFoul/valid.json
        source_path: /home/vorajv/dataset/OSL-XFoul
        dataloader:
          batch_size: 1
          shuffle: false
          num_workers: 0
          pin_memory: false
      test:
        annotation_path: /home/vorajv/dataset/OSL-XFoul/test.json
        source_path: /home/vorajv/dataset/OSL-XFoul
        dataloader:
          batch_size: 1
          shuffle: false
          num_workers: 0
          pin_memory: false
  inputs:
    video:
      modality: video
      representation: raw
      source:
        format: mp4
      sampling:
        start_frame: 63
        end_frame: 87
        input_fps: 25
        target_fps: 17
        temporal_tokens: 44
      transform: {}
      augmentations: {}
      params: {}
    question:
      modality: text
      representation: raw
      source:
        format: json
      sampling: {}
      transform: {}
      augmentations: {}
      params: {}

MODEL:
  runtime:
    dtype: fp32
    device: auto
    compile: false
    freeze: false
  load:
    checkpoint_path: null
    pretrained: false
    strict: true
    map_location: null
    format: auto
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        registry: backbone
        name: lightweight_video_descriptor
      params: {}
      overrides: {}
    mm_projector:
      kind: projector
      source:
        provider: opensportslib
        registry: adapter
        name: numeric_linear_projector
      params:
        input_dim: 270
        output_dim: 64
      overrides: {}
    llm_decoder:
      kind: decoder
      source:
        provider: huggingface
        name: /home/vorajv/.cache/huggingface/hub/models--distilgpt2/snapshots/2290a62682d06624634c1f46a6ad5be0f47f38aa
      params:
        repo_id: /home/vorajv/.cache/huggingface/hub/models--distilgpt2/snapshots/2290a62682d06624634c1f46a6ad5be0f47f38aa
      overrides: {}
  topology:
    - from: video_encoder
      to: mm_projector
    - from: mm_projector
      to: llm_decoder
  metadata:
    backend: xvars_hf

IO:
  inputs:
    video: video_encoder
    question: llm_decoder
  outputs:
    answer_text: llm_decoder
    explanation_text: llm_decoder

TRAIN:
  trainer:
    type: vqa
  epochs: 1
  criterion:
    type: CrossEntropyLoss
  optimizer:
    type: AdamW
    lr: 0.0002
  scheduler:
    type: constant
  execution:
    enabled: true
    backend: xvars_hf
    training_backend: xvars_lora
    dry_run: false
    prompt:
      style: detailed
      system_prompt: You are an artificial intelligence assistant for visual football referee questions. Give short and helpful answers.
      include_priors: true
      prior_fields: [action, offence, contact, bodypart]
    sft:
      max_seq_length: 96
      answer_field: references
      include_video_tokens: false
      video_token_len: 0
      per_device_train_batch_size: 1
      per_device_eval_batch_size: 1
      gradient_accumulation_steps: 1
      num_train_epochs: 1
      learning_rate: 0.0001
      logging_steps: 1
      save_strategy: "no"
      fp16: false
      bf16: false
    hf:
      model_id: /home/vorajv/.cache/huggingface/hub/models--distilgpt2/snapshots/2290a62682d06624634c1f46a6ad5be0f47f38aa
      local_files_only: true
      prefer_cuda: false
    lora:
      r: 2
      alpha: 4
      dropout: 0.0
      bias: none
      prepare_kbit: false
      target_modules: [c_attn]
    quantization:
      enabled: false
      load_in_4bit: true
      compute_dtype: bfloat16
    checkpoint:
      save_adapter: true
      merge_and_save: false
  sampling: {}
  selection:
    monitor: loss
    mode: min
  checkpoint:
    save_every: 1
    save_best: true
