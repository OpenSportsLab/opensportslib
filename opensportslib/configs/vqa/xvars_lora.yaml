TASK: VQA
VERSION: 2

SYSTEM:
  paths:
    log_dir: ./logs
    save_dir: ./checkpoints_vqa_lora
    work_dir: ./checkpoints_vqa_lora
  device: cuda
  gpu:
    count: 4
    id: 0
  reproducibility:
    use_seed: true
    seed: 42

DATA:
  common:
    dataset_name: OSL-XFoul
    data_root: /home/vorajv/dataset/OSL-XFoul
    feature_index: /home/vorajv/dataset/OSL-XFoul/feature_index.json
    prediction_index: /home/vorajv/dataset/OSL-XFoul/prediction_index.json
    runtime:
      loader_backend: opencv
    splits:
      train:
        annotation_path: /home/vorajv/dataset/OSL-XFoul/train.json
        source_path: /home/vorajv/dataset/OSL-XFoul
        dataloader:
          batch_size: 1
          shuffle: true
          num_workers: 0
          pin_memory: false
          mp_context: spawn
          persistent_workers: false
      valid:
        annotation_path: /home/vorajv/dataset/OSL-XFoul/valid.json
        source_path: /home/vorajv/dataset/OSL-XFoul
        dataloader:
          batch_size: 1
          shuffle: false
          num_workers: 0
          pin_memory: false
          mp_context: spawn
          persistent_workers: false
      test:
        annotation_path: /home/vorajv/dataset/OSL-XFoul/test.json
        source_path: /home/vorajv/dataset/OSL-XFoul
        dataloader:
          batch_size: 1
          shuffle: false
          num_workers: 0
          pin_memory: false
          mp_context: spawn
          persistent_workers: false
  inputs:
    video:
      modality: video
      representation: raw
      source:
        format: mp4
      sampling:
        num_frames: 100
      transform: {}
      augmentations: {}
      params: {}
    question:
      modality: text
      representation: raw
      source:
        format: json
      sampling: {}
      transform: {}
      augmentations: {}
      params: {}

MODEL:
  runtime:
    dtype: fp32
    device: auto
    compile: false
    freeze: false
  load:
    checkpoint_path: null
    pretrained: false
    strict: true
    map_location: null
    format: auto
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        registry: backbone
        name: xvars_clip_features
      params:
        feature_source: indexed_or_raw_clip
        feature_dim: 1024
      overrides: {}
    mm_projector:
      kind: projector
      source:
        provider: opensportslib
        registry: adapter
        name: xvars_mm_projector
      params:
        input_dim: 1024
      overrides: {}
    llm_decoder:
      kind: decoder
      source:
        provider: huggingface
        name: lmsys/vicuna-7b-v1.1
      params:
        repo_id: lmsys/vicuna-7b-v1.1
      overrides: {}
  topology:
    - from: video_encoder
      to: mm_projector
    - from: mm_projector
      to: llm_decoder
  metadata:
    backend: xvars_videochatgpt

IO:
  inputs:
    video: video_encoder
    question: llm_decoder
  outputs:
    answer_text: llm_decoder
    explanation_text: llm_decoder

TRAIN:
  trainer:
    type: vqa
  execution:
    enabled: true
    backend: xvars_videochatgpt
    training_backend: xvars_videochatgpt_lora
    feature_backend: xvars_clip
    view_sampling_policy: random_train_deterministic_eval
    dry_run: false
    xvars:
      base_model: lmsys/vicuna-7b-v1.1
      projection_path: null
      conv_mode: video-chatgpt_v1
      video_token_len: 356
      mm_hidden_size: 1024
      feature_source: auto
    prompt:
      style: detailed
      system_prompt: You are an artificial intelligence assistant for visual football referee questions. Give short and helpful answers.
      include_priors: true
      prior_fields: [action, offence, contact, bodypart]
    generation:
      max_new_tokens: 1024
      temperature: 0.2
    # OpenSportsLib-native VQA evaluation config. This does not correspond to
    # an upstream X-VARS benchmark scorer.
    eval_profile:
      metric_set: [exact_match, contains_match, token_f1, semantic]
      aggregation: mean
      exclusions: []
    production:
      timeout_s: 30
      retry_count: 1
      retry_backoff_s: 0.5
      fallback_policy: baseline_on_failure
      max_new_tokens_cap: 1024
    sft:
      max_seq_length: 768
      answer_field: references
      include_video_tokens: true
      video_token_len: 356
      gradient_accumulation_steps: 1
      num_train_epochs: 1
      learning_rate: 0.0001
      logging_steps: 50
      disable_tqdm: true
      completion_only_loss: true
      save_strategy: "no"
      fp16: false
      bf16: false
    hf:
      model_id: lmsys/vicuna-7b-v1.1
      local_files_only: false
      prefer_cuda: true
      cuda_device_index: 1
    lora:
      r: 16
      alpha: 32
      dropout: 0.05
      bias: none
      prepare_kbit: true
      target_modules: [mm_projector, upsample_features, up_proj, down_proj, gate_proj, k_proj, q_proj, v_proj, o_proj]
    quantization:
      enabled: true
      load_in_4bit: true
      bnb_4bit_quant_type: nf4
      compute_dtype: bfloat16
      bnb_4bit_use_double_quant: true
    checkpoint:
      save_adapter: true
      merge_and_save: false
  selection:
    monitor: loss
    mode: min
  checkpoint:
    save_every: 1
    save_best: true
