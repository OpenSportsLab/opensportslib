SYSTEM:
  paths:
    save_dir: ./checkpoints_vqa_qwen_vl_native_awq

MODEL:
  topology: []
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        name: qwen_vl_native
      params:
        feature_source: raw_video
        native_vl:
          visual_input_mode: frames
          num_frames: 8
          min_pixels: 200704
          max_pixels: 1003520
      overrides: {}
    llm_decoder:
      kind: decoder
      source:
        provider: huggingface
        name: Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      params:
        repo_id: Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      overrides: {}
  metadata:
    backend: qwen_vl_native_infer

TRAIN:
  execution:
    prompt:
      system_prompt: You are a football video assistant. Answer the VQA question using the provided visual evidence and referee priors.
    native_vl:
      visual_input_mode: frames
      num_frames: 8
      min_pixels: 200704
      max_pixels: 1003520
    hf:
      tokenizer_id: ${MODEL.components.llm_decoder.params.repo_id}
      prefer_cuda: true
      local_files_only: false
      device_map: auto
