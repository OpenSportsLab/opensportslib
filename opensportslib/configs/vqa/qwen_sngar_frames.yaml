SYSTEM:
  paths:
    save_dir: ./checkpoints_vqa_qwen_sngar_frames

DATA:
  common:
    dataset_name: sngar-frames-vqa
    data_root: /home/vorajv/dataset/sngar-frames
    splits:
      test:
        annotation_path: ${DATA.common.data_root}/test.json
        source_path: ${DATA.common.data_root}
        dataloader:
          batch_size: 1
          shuffle: false
          num_workers: 0
          pin_memory: false
  inputs:
    video:
      modality: frames_npy
      representation: frames_npy
      source:
        format: npy
      sampling:
        num_frames: 16
      transform: {}
      augmentations: {}
      params: {}
    question:
      modality: text
      representation: raw
      source:
        format: json
      sampling: {}
      transform: {}
      augmentations: {}
      params: {}

MODEL:
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        name: xvars_clip_features
      load:
        weights_path: /home/vorajv/X-VARS/weights/14_model.pth.tar
      params:
        feature_source: raw_video
        vision_tower: openai/clip-vit-large-patch14
        feature_dim: 1024
      overrides: {}
    mm_projector:
      kind: projector
      source:
        provider: opensportslib
      params:
        input_dim: 1024
      overrides: {}
    llm_decoder:
      kind: decoder
      source:
        provider: huggingface
        name: Qwen/Qwen2.5-7B-Instruct
      params:
        repo_id: Qwen/Qwen2.5-7B-Instruct
      overrides: {}
  metadata:
    backend: qwen_xvars_infer

TRAIN:
  execution:
    prompt:
      # system_prompt: >-
      #   You are a soccer action classifier.
      #   Your task is to look at the soccer video and output exactly one label from this list:
      #   PASS, HEADER, HIGH PASS, OUT, CROSS, THROW IN, SHOT, PLAYER SUCCESSFUL TACKLE, FREE KICK, GOAL.
      #   Class meanings:
      #   PASS = a normal pass between players along the ground or short distance.
      #   HEADER = the ball is intentionally played with the head.
      #   HIGH PASS = a lofted or aerial pass sent through the air to a teammate, but not specifically a cross.
      #   OUT = the ball goes out of play.
      #   CROSS = a ball is played from a wide area into the penalty area or dangerous central area.
      #   THROW IN = play is restarted with a throw-in from the sideline.
      #   SHOT = an attempt is made to score.
      #   PLAYER SUCCESSFUL TACKLE = a player successfully wins or challenges for the ball with a tackle.
      #   FREE KICK = play is restarted with a free kick.
      #   GOAL = the ball enters the goal and a goal is scored.
      #   Output rules:
      #   Output exactly one label.
      #   Do not explain.
      #   Do not output reasoning.
      #   Do not output <think>.
      #   Do not output ASSISTANT:.
      #   Do not leave the answer blank.
      #   If uncertain, choose the single closest valid label.
      include_priors: false
      video_token_len: 356
    generation:
      max_new_tokens: 3
      temperature: 0.0
      repetition_penalty: 1.0
      no_repeat_ngram_size: 2
    xvars:
      feature_mode: clip_compat
    hf:
      tokenizer_id: ${MODEL.components.llm_decoder.params.repo_id}
      prefer_cuda: true
      local_files_only: false
      device_map: auto
      offload_folder: ./hf_offload_qwen
