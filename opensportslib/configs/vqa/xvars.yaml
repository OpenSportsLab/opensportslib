SYSTEM:
  paths:
    save_dir: ./checkpoints_vqa_xvars_lora
  gpu:
    count: 4

MODEL:
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
      # X-VARS visual checkpoint: local file path or HF model repo ID.
      load:
        weights_path: OpenSportsLab/trained-clip-vit-large-patch14
      params:
        # CLIP architecture and image processor to instantiate.
        feature_source: indexed_or_raw_clip
        vision_tower: openai/clip-vit-large-patch14
        feature_dim: 1024
      overrides: {}
    mm_projector:
      kind: projector
      source:
        provider: opensportslib
      params:
        input_dim: 1024
      overrides: {}
    llm_decoder:
      kind: decoder
      source:
        provider: opensportslib
      params:
        repo_id: OpenSportsLab/base_model_videoChatGPT
      overrides: {}
  metadata:
    backend: xvars_videochatgpt

TRAIN:
  execution:
    prompt:
      system_prompt: You are Video-ChatGPT, a large vision-language assistant. You are able to understand the video content that the user provides, and assist the user with a variety of tasks using natural language.Follow the instructions carefully and explain your answers in detail based on the provided video.

    # Optional XFoul-only generated-answer smoke test.
    # During LoRA training, this runs generation on one known training sample and
    # checks that the answer still contains referee-domain terms and avoids known
    # code-like failure strings. Disable or replace these values for non-XFoul data.
    generated_validation:
      enabled: true
      sample_id: action_0
      every_steps: 25
      max_new_tokens: 128
      require_relevance: true
      required_terms: [foul, card, challenge, spa, dogso, advantage]
      forbidden_terms: [get_children, django, httpclient, "```python", "```php"]
    
    hf:
      tokenizer_id: ${MODEL.components.llm_decoder.params.repo_id}
