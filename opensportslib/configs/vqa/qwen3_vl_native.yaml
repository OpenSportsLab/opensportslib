SYSTEM:
  paths:
    save_dir: ./checkpoints_vqa_qwen3_vl_native
  gpu:
    count: 4
    id: null

MODEL:
  topology: []
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        name: qwen_vl_native
      params:
        feature_source: raw_video
        native_vl:
          visual_input_mode: frames
          num_frames: 8
          min_pixels: 50176 # 28*28*64
          max_pixels: 401408 # 28*28*512
      overrides: {}
    llm_decoder:
      kind: decoder
      source:
        provider: huggingface
        name: Qwen/Qwen3-VL-8B-Instruct
      params:
        repo_id: Qwen/Qwen3-VL-8B-Instruct
      overrides: {}
  metadata:
    backend: qwen_vl_native_infer

TRAIN:
  optimizer:
    type: adamw_torch
    lr: 0.0002
    weight_decay: 0.001
  execution:
    acc_grad_iter: 4
    training_backend: qwen_vl_native_lora
    prompt:
      system_prompt: You are a football video assistant. Answer the VQA question using the provided visual evidence and referee priors.
    native_vl:
      visual_input_mode: frames
      num_frames: 8
      min_pixels: 50176 # 28*28*64
      max_pixels: 401408 # 28*28*512
    hf:
      tokenizer_id: ${MODEL.components.llm_decoder.params.repo_id}
      prefer_cuda: true
      local_files_only: false
      device_map: null
    sft:
      per_device_train_batch_size: 1
      per_device_eval_batch_size: 1
      max_seq_length: 1024
      max_grad_norm: 1.0
      memory_cache_rows: 0
      gradient_checkpointing: true
      ddp_find_unused_parameters: false
      ddp_broadcast_buffers: false
      resume_optimizer_state: false
      cache_tokenized_rows: false
      disable_tqdm: false
      save_strategy: epoch
      # save_steps: 100
      # save_total_limit: 3
      evaluation_strategy: "no"
    lora:
      prepare_kbit: false
    quantization:
      enabled: false
