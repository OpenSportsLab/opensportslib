TASK: classification
VERSION: 3

SYSTEM:
  paths:
    log_dir: ./logs
    save_dir: ./checkpoints
  device: cuda
  gpu:
    count: 1
    id: 0
  reproducibility:
    use_seed: true
    seed: 42

DATA:
  common:
    dataset_name: dataset_name
    data_root: /path/to/data
    runtime:
      loader_backend: opencv
    splits:
      train:
        annotation_path: /path/to/train.json
        source_path: /path/to/train
        dataloader:
          batch_size: 8
          shuffle: true
          num_workers: 4
          pin_memory: true
      valid:
        annotation_path: /path/to/valid.json
        source_path: /path/to/valid
        dataloader:
          batch_size: 8
          shuffle: false
          num_workers: 4
          pin_memory: true
      test:
        annotation_path: /path/to/test.json
        source_path: /path/to/test
        dataloader:
          batch_size: 8
          shuffle: false
          num_workers: 4
          pin_memory: true
  inputs:
    video:
      modality: video
      representation: raw
      source:
        format: mp4
      sampling:
        num_frames: 16
      transform:
        resize:
          height: 224
          width: 224
      augmentations: {}
      params: {}

MODEL:
  schema_version: 3
  task: classification
  runtime:
    dtype: fp32
    device: auto
    compile: false
    freeze: false
  load:
    checkpoint_path: null
    pretrained: false
    strict: true
    map_location: null
    format: auto
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        registry: backbone
        name: null
      params: {}
      overrides: {}
    task_head:
      kind: head
      source:
        provider: opensportslib
        registry: head
        name: null
      params: {}
      overrides: {}
  topology:
    - from: video_encoder
      to: task_head

IO:
  inputs:
    video: video_encoder
    label: task_head
  outputs:
    logits: task_head

TRAIN:
  trainer:
    type: classification
  epochs: 20
  criterion:
    type: CrossEntropyLoss
  optimizer:
    type: AdamW
    lr: 0.0001
  scheduler:
    type: StepLR
  execution:
    enabled: true
    log_interval: 10
  sampling:
    use_weighted_sampler: false
    use_weighted_loss: false
  selection:
    monitor: loss
    mode: min
  checkpoint:
    save_every: 5
    save_best: true
