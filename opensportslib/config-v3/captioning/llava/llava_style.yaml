TASK: captioning
VERSION: 3

SYSTEM:
  paths:
    log_dir: ./logs
    save_dir: ./checkpoints_llava
  device: cuda
  gpu:
    count: 1
    id: 0
  reproducibility:
    use_seed: true
    seed: 42

DATA:
  common:
    dataset_name: llava_style_captioning
    data_root: /path/to/data
    runtime:
      loader_backend: opencv
    splits:
      train:
        annotation_path: /path/to/train.json
        source_path: /path/to/train
        dataloader:
          batch_size: 4
          shuffle: true
          num_workers: 4
          pin_memory: true
      valid:
        annotation_path: /path/to/valid.json
        source_path: /path/to/valid
        dataloader:
          batch_size: 4
          shuffle: false
          num_workers: 4
          pin_memory: true
      test:
        annotation_path: /path/to/test.json
        source_path: /path/to/test
        dataloader:
          batch_size: 4
          shuffle: false
          num_workers: 4
          pin_memory: true
  inputs:
    image:
      modality: image
      representation: raw
      source:
        format: image
      sampling: {}
      transform:
        resize:
          height: 336
          width: 336
      augmentations: {}
      params: {}
    text:
      modality: text
      representation: prompt
      source:
        format: json
      sampling: {}
      transform: {}
      augmentations: {}
      params: {}

MODEL:
  schema_version: 3
  task: captioning
  runtime:
    dtype: bf16
    device: auto
    compile: false
    freeze: false
  load:
    checkpoint_path: null
    pretrained: false
    strict: true
    map_location: null
    format: auto
  components:
    vision_encoder:
      kind: encoder
      source:
        provider: huggingface
        repo_id: openai/clip-vit-large-patch14
      load:
        pretrained: true
      runtime:
        freeze: true
      params: {}
      overrides: {}
    vision_projector:
      kind: projector
      source:
        provider: opensportslib
        registry: adapter
        name: MLPProjector
      params:
        in_dim: 1024
        out_dim: 4096
      overrides: {}
    text_decoder:
      kind: decoder
      source:
        provider: huggingface
        repo_id: meta-llama/Llama-3.1-8B-Instruct
      load:
        pretrained: true
      params: {}
      overrides: {}
  topology:
    - from: vision_encoder
      to: vision_projector
    - from: vision_projector
      to: text_decoder
      map:
        features: visual_tokens

IO:
  inputs:
    image: vision_encoder
    text: text_decoder
  outputs:
    captions: text_decoder

TRAIN:
  trainer:
    type: captioning
  epochs: 20
  criterion:
    type: CrossEntropyLoss
  optimizer:
    type: AdamW
    lr: 0.0001
  scheduler:
    type: StepLR
  execution:
    enabled: true
    use_amp: true
  sampling: {}
  selection:
    monitor: caption_loss
    mode: min
  checkpoint:
    save_every: 5
    save_best: true
