TASK: vqa
VERSION: 2

SYSTEM:
  paths:
    log_dir: ./logs
    save_dir: ./checkpoints_vqa_qwen_sn_vqa_2026
    work_dir: ./checkpoints_vqa_qwen_sn_vqa_2026
  device: cuda
  gpu:
    count: 1
    id: 0
  reproducibility:
    use_seed: true
    seed: 42

DATA:
  common:
    dataset_name: SN-VQA-2026-test-qwen-native
    data_root: /home/vorajv/dataset/SN-VQA-2026
    feature_index: ""
    prediction_index: ""
    runtime:
      loader_backend: opencv
    splits:
      test:
        annotation_path: /home/vorajv/dataset/SN-VQA-2026/test_osl_qwen_native.json
        source_path: /home/vorajv/dataset/SN-VQA-2026
        dataloader:
          batch_size: 1
          shuffle: false
          num_workers: 0
          pin_memory: false
          mp_context: spawn
          persistent_workers: false
  inputs:
    video:
      modality: video
      representation: raw
      source:
        format: mp4
      sampling:
        num_frames: 8
      transform: {}
      augmentations: {}
      params: {}
    question:
      modality: text
      representation: raw
      source:
        format: json
      sampling: {}
      transform: {}
      augmentations: {}
      params: {}

MODEL:
  runtime:
    dtype: fp16
    device: auto
    compile: false
    freeze: false
  load:
    checkpoint_path: null
    pretrained: false
    strict: true
    map_location: null
    format: auto
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        name: qwen_vl_native
      params:
        feature_source: raw_video
        native_vl:
          visual_input_mode: frames
          num_frames: 8
          min_pixels: 50176
          max_pixels: 401408
      overrides: {}
    llm_decoder:
      kind: decoder
      source:
        provider: huggingface
        name: Qwen/Qwen3-VL-8B-Instruct
      params:
        repo_id: Qwen/Qwen3-VL-8B-Instruct
      overrides: {}
  topology: []
  metadata:
    backend: qwen_vl_native_infer

IO:
  inputs:
    video: video_encoder
    question: llm_decoder
  outputs:
    answer_text: llm_decoder
    explanation_text: llm_decoder

TRAIN:
  trainer:
    type: vqa
  epochs: 1
  criterion:
    type: CrossEntropyLoss
  optimizer:
    type: AdamW
    lr: 0.0002
    weight_decay: 0.001
  scheduler:
    type: constant
  execution:
    enabled: true
    training_backend: qwen_vl_native_lora
    feature_backend: xvars_clip
    view_sampling_policy: random_train_deterministic_eval
    acc_grad_iter: 1
    log_interval: 1
    dry_run: false
    prompt:
      style: detailed
      system_prompt: You are a football video assistant. Answer the VQA question using the provided visual evidence.
      include_priors: false
    generation:
      max_new_tokens: 128
      temperature: 0.0
    eval_profile:
      metric_set: [exact_match, contains_match, token_f1]
      aggregation: mean
      exclusions: []
    native_vl:
      visual_input_mode: frames
      num_frames: 8
      min_pixels: 50176
      max_pixels: 401408
    hf:
      tokenizer_id: ${MODEL.components.llm_decoder.params.repo_id}
      prefer_cuda: true
      local_files_only: false
      device_map: auto
    quantization:
      enabled: false
      load_in_4bit: true
      bnb_4bit_quant_type: nf4
      compute_dtype: float16
      bnb_4bit_use_double_quant: true
  selection:
    monitor: loss
    mode: min
  checkpoint:
    save_every: 1
    save_best: true
