TASK: localization
VERSION: 2

SYSTEM:
  paths:
    log_dir: ./logs
    save_dir: ./checkpoints
    work_dir: ${SYSTEM.paths.save_dir}
  device: cuda
  gpu:
    count: 4
    id: 0
  reproducibility:
    use_seed: true
    seed: 42

DATA:
  common:
    dataset_name: SoccerNet
    data_root: /home/vorajv/dataset/BAS
    classes:
      - PASS
      - DRIVE
      - HEADER
      - HIGH PASS
      - OUT
      - CROSS
      - THROW IN
      - SHOT
      - BALL PLAYER BLOCK
      - PLAYER SUCCESSFUL TACKLE
      - FREE KICK
      - GOAL
    runtime:
      loader_backend: dali
    splits:
      train:
        type: VideoGameWithDali
        annotation_path: ${DATA.common.data_root}/train/annotations-train.json
        source_path: ${DATA.common.data_root}/train/
        output_map: [data, label]
        dataloader:
          batch_size: 8
          shuffle: true
          num_workers: 4
          pin_memory: true
      valid:
        type: VideoGameWithDali
        annotation_path: ${DATA.common.data_root}/valid/annotations-valid.json
        source_path: ${DATA.common.data_root}/valid/
        output_map: [data, label]
        dataloader:
          batch_size: 8
          shuffle: true
      valid_data_frames:
        type: VideoGameWithDaliVideo
        annotation_path: ${DATA.common.splits.valid.annotation_path}
        source_path: ${DATA.common.splits.valid.source_path}
        output_map: [data, label]
        overlap_len: 0
        dataloader:
          batch_size: 4
          shuffle: false
      test:
        type: VideoGameWithDaliVideo
        annotation_path: ${DATA.common.data_root}/test/an-test.json
        source_path: ${DATA.common.data_root}/test/
        output_map: [data, label]
        results: results_spotting_test
        metric: tight
        nms_window: 2
        overlap_len: 50
        dataloader:
          batch_size: 4
          shuffle: false
      challenge:
        type: VideoGameWithDaliVideo
        annotation_path: ${DATA.common.data_root}/challenge/annotations.json
        output_map: [data, label]
        overlap_len: 50
        dataloader:
          batch_size: 4
          shuffle: false
  inputs:
    video:
      modality: video
      representation: raw
      source:
        format: mp4
      sampling:
        epoch_num_frames: 500000
        clip_len: 100
        input_fps: 25
        extract_fps: 2
      transform:
        resize:
          height: 224
          width: 398
        normalization:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
      augmentations: {}
      params:
        color_mode: rgb
        crop_dim: -1
        mixup: true
        dilate_len: 0

MODEL:
  metadata:
    family: E2E
    runner:
      type: runner_e2e
  runtime:
    dtype: fp32
    device: auto
    compile: false
    freeze: false
  load:
    checkpoint_path: null
    pretrained: false
    strict: true
    map_location: null
    format: auto
  components:
    video_encoder:
      kind: encoder
      source:
        provider: opensportslib
        registry: backbone
        name: rny008_gsm
      params: {}
      overrides: {}
    task_head:
      kind: head
      source:
        provider: opensportslib
        registry: head
        name: gru
      params: {}
      overrides: {}
  topology:
    - from: video_encoder
      to: task_head

IO:
  inputs:
    video: video_encoder
    label: task_head
  outputs:
    logits: task_head

TRAIN:
  trainer:
    type: trainer_e2e
  epochs: 10
  criterion:
    type: CrossEntropyLoss
  optimizer:
    type: AdamWithScaler
    lr: 0.01
  scheduler:
    type: ChainedSchedulerE2E
    acc_grad_iter: 1
    num_epochs: ${TRAIN.epochs}
    warm_up_epochs: 3
  execution:
    enabled: true
    multi_gpu: true
    acc_grad_iter: 1
    base_num_valid_epochs: 30
    start_valid_epoch: 4
    valid_map_every: 1
    criterion_valid: map
  sampling: {}
  selection:
    monitor: valid_loss
    mode: min
  checkpoint:
    save_best: true
