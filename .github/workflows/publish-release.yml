name: Publish Stable Release to PyPI

on:
  release:
    types: [published]

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Synchronize stable version for build
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release_versions.py set-stable "$RELEASE_TAG"

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Checkout latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit released version to main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python scripts/release_versions.py set-stable "$RELEASE_TAG"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pyproject.toml server/pyproject.toml
          if git diff --cached --quiet; then
            echo "main already contains release version"
          else
            git commit -m "fix: synchronize stable release version"
            git push origin main
          fi
