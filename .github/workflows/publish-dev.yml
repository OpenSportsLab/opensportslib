name: Auto Pre-release Publish to PyPI

on:
  workflow_run:
    workflows: ["CI Fast Tests"]
    branches:
      - dev
    types: [completed]

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    concurrency:
      group: publish-dev
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Bump and synchronize development version
        run: python scripts/release_versions.py bump-dev

      - name: Commit bumped version
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pyproject.toml server/pyproject.toml
          git commit -m "fix: synchronize development version"
          git push

      - name: Build package
        run: python -m build

      - name: Publish
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
