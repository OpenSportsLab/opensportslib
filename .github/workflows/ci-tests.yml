name: CI Fast Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" -e ./server

      - name: Run OpenSportsLib tests
        run: bash scripts/run_tests.sh

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensportslib-test-reports
          path: |
            .test-reports/latest/summary.md
            .test-reports/latest/failed-tests.txt
            .test-reports/latest/fast-report.json
            .test-reports/latest/fast-junit.xml
            .test-reports/latest/coverage*.xml
            .test-reports/latest/coverage*.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
