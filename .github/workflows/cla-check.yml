name: CLA automation

on:
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

# This workflow intentionally does not check out the PR or execute contributor
# supplied code. It only reads GitHub API metadata and writes comments/checks.
permissions:
  contents: read
  pull-requests: read
  issues: write
  checks: write

jobs:
  cla:
    name: Update CLA status
    runs-on: ubuntu-latest
    steps:
      - name: Validate CLA acceptance
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let prNumber;
            if (context.eventName === 'pull_request_target') {
              prNumber = context.payload.pull_request.number;
            } else if (context.eventName === 'issue_comment' && context.payload.issue.pull_request) {
              prNumber = context.payload.issue.number;
            } else {
              core.info('Comment is not on a pull request; nothing to do.');
              return;
            }

            const readFile = async (path) => {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: context.payload.repository.default_branch });
              return Buffer.from(response.data.content, 'base64').toString('utf8');
            };
            const configText = await readFile('.github/cla.yml');
            const value = (key) => {
              const match = configText.match(new RegExp(`^${key}:\\s*["']?([^"'\\n#]+)["']?`, 'm'));
              return match && match[1].trim();
            };
            const version = value('version');
            const phrase = value('required_signing_phrase');
            const ledgerIssue = Number(value('ledger_issue'));
            if (!version || !phrase || !Number.isInteger(ledgerIssue) || ledgerIssue < 1) {
              core.setFailed('CLA is not configured: set .github/cla.yml ledger_issue to the CLA Signature Ledger issue number.');
              return;
            }
            const document = await readFile('.github/CLA.md');
            const documentHash = crypto.createHash('sha256').update(document).digest('hex');
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            if (pr.base.ref !== 'dev') return;
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: prNumber, per_page: 100 });
            const unresolved = commits.filter((commit) => !commit.author || !commit.author.login);
            const authors = [...new Set(commits.map((commit) => commit.author && commit.author.login).filter(Boolean))];

            const marker = '<!-- opensportslib-cla-pr-instructions -->';
            const signingComment = context.eventName === 'issue_comment' ? context.payload.comment : null;
            if (signingComment && signingComment.body.trim() === phrase && authors.includes(signingComment.user.login)) {
              const signatureMarker = `<!-- opensportslib-cla-signature signer=${signingComment.user.login} version=${version} sha256=${documentHash} -->`;
              const ledgerComments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: ledgerIssue, per_page: 100 });
              if (!ledgerComments.some((comment) => comment.user.type === 'Bot' && comment.body.includes(signatureMarker))) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: ledgerIssue,
                  body: `${signatureMarker}\nSigner: @${signingComment.user.login}\nAccepted at: ${new Date().toISOString()}\nAgreement: ${version}`,
                });
              }
            }

            const ledgerComments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: ledgerIssue, per_page: 100 });
            const signed = new Set(ledgerComments.filter((comment) => comment.user.type === 'Bot').flatMap((comment) => {
              const match = comment.body.match(/<!-- opensportslib-cla-signature signer=([^ ]+) version=([^ ]+) sha256=([a-f0-9]+) -->/);
              return match && match[2] === version && match[3] === documentHash ? [match[1]] : [];
            }));
            const missing = authors.filter((author) => !signed.has(author));
            const passed = unresolved.length === 0 && missing.length === 0;
            const instructions = `${marker}\n## CLA required\nThe following commit authors must comment this exact phrase to accept the [Individual CLA](https://github.com/${owner}/${repo}/blob/${context.payload.repository.default_branch}/.github/CLA.md):\n\n> ${phrase}\n\nMissing signatures: ${missing.length ? missing.map((author) => `@${author}`).join(', ') : 'none'}.`;
            const prComments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });
            const prior = prComments.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (!passed) {
              if (prior) await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body: instructions });
              else await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: instructions });
            }
            const unresolvedText = unresolved.length ? ` Unlinked commit author(s): ${unresolved.map((commit) => commit.sha.slice(0, 7)).join(', ')}.` : '';
            await github.rest.checks.create({
              owner, repo, name: 'CLA check', head_sha: pr.head.sha, status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              output: {
                title: passed ? 'All commit authors accepted the CLA' : 'CLA acceptance required',
                summary: passed ? `All ${authors.length} commit author(s) accepted ${version}.` : `Missing signatures: ${missing.join(', ') || 'none'}.${unresolvedText}`,
              },
            });
