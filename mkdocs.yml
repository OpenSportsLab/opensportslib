site_name: OpenSportsLib
site_description: Configuration-driven sports-video workflows for classification, action spotting, and visual question answering.
repo_url: https://github.com/OpenSportsLab/opensportslib
repo_name: OpenSportsLab/opensportslib

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.integrate
    - content.action.edit

  palette:
    - scheme: default
      primary: green
      accent: lime
    - scheme: slate
      primary: green
      accent: lime

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Project Structure: getting-started/project_structure.md
      - First Workflow: getting-started/first-workflow.md
      - SLURM Guide (salloc, srun): getting-started/slurm.md
  - Workflows:
      - Training, Inference & Evaluation: tni/tni.md
      - Configuration: config/configuration-guide.md
      - Inference Server: server/inference-server.md
  - Tasks:
      - Classification: tni/tni.md
      - Localization & Spotting: spotting/tracking-action-spotting.md
      - VQA: tools/vqa.md
      - HDF5 Header Spotting: headers/README.md
  - Data:
      - OSL JSON Format: data/osl-json-format.md
      - Dataset Conversion: tools/dataset-conversion.md
      - Hugging Face Dataset Transfer: tools/hf-dataset-transfer.md
  - Configuration:
      - Configuration Guide: config/configuration-guide.md
      - Legacy to Canonical Mapping: config/legacy-to-canonical-mapping.md
      - Configuration Developer Guide: config/developer-guide.md
  - Reference:
      - Model Zoo: model-zoo.md
      - Public Python API: api/api.md
      - Inference Server: server/inference-server.md
      - Hugging Face Model Upload: tools/hf-model-upload.md
      - SN-GAR Action Spotting: tools/sngar-spotting.md
  - Developers:
      - Architecture: developer/architecture.md
      - Supported Extension Paths: developer/extensions.md
      - Extension APIs:
          - Configuration: developer/config-reference.md
          - Data: developer/data-reference.md
          - Model Construction: developer/model-reference.md
          - Runtime & Metrics: developer/runtime-reference.md
          - Tools: developer/tools-reference.md
      - Internal Modules: developer/internal-catalog.md
      - Testing & Review: developer/testing.md
      - Configuration Authoring: config/developer-guide.md
  - Contributing: contributing.md
      

plugins:
  - search
  - include-markdown:
      rewrite_relative_urls: true
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed

  - pymdownx.snippets:
      base_path: .

  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
